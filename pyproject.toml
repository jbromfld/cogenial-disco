[project]
name = "cogenial-disco"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary",
    "pgvector",
    "pydantic-settings",
    "sentence-transformers",
    "openai",
    "anthropic",
    "langchain",
    "langchain-anthropic",
    "langchain-openai",
    "langgraph",
    "langsmith",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "memory*"]
namespaces = true

[tool.setuptools.package-data]
memory = ["sql/*.sql"]
